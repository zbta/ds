<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text File Compressor</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: monospace;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="file"], button {
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #333;
            padding: 10px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Text Filter / Compressor</h2>
    
    <!-- File Input -->
    <input type="file" id="fileInput" accept=".txt">

    <!-- Action Buttons -->
    <button id="downloadBtn" disabled>Download Compressed File</button>

    <!-- Status Message -->
    <div id="status">Status: Ready</div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const downloadBtn = document.getElementById('downloadBtn');
    const statusDiv = document.getElementById('status');

    let processedBlobUrl = null;

    fileInput.addEventListener('change', async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        // Reset state
        downloadBtn.disabled = true;
        if (processedBlobUrl) {
            URL.revokeObjectURL(processedBlobUrl);
            processedBlobUrl = null;
        }

        statusDiv.innerText = "Status: Processing file...";

        try {
            // Target prefixes to extract
            const targetPrefixes = ["jpxp77", "DampKristians"];
            const foundPrefixes = new Set();

            // Read file in chunks to support multi-megabyte / large files without memory crashes
            const chunkSize = 1024 * 1024; // 1 MB chunks
            let offset = 0;
            let leftover = "";

            while (offset < file.size) {
                const chunk = file.slice(offset, offset + chunkSize);
                const text = await chunk.text();
                const content = leftover + text;
                const lines = content.split(/\r?\n/);

                // The last element might be an incomplete line; save it for next chunk
                leftover = lines.pop();

                for (let line of lines) {
                    processLine(line, targetPrefixes, foundPrefixes);
                }

                offset += chunkSize;
                statusDiv.innerText = `Status: Processing... ${Math.min(100, Math.round((offset / file.size) * 100))}%`;
            }

            // Process any remaining line content
            if (leftover) {
                processLine(leftover, targetPrefixes, foundPrefixes);
            }

            // Convert extracted results to plain text string output
            const resultText = Array.from(foundPrefixes).join("\n");
            
            // Create Blob for file download without injecting text into DOM
            const blob = new Blob([resultText], { type: "text/plain" });
            processedBlobUrl = URL.createObjectURL(blob);

            downloadBtn.disabled = false;
            statusDiv.innerText = `Status: Done! Extracted ${foundPrefixes.size} unique keys.`;

        } catch (error) {
            console.error(error);
            statusDiv.innerText = "Status: Error processing file.";
        }
    });

    function processLine(line, targetPrefixes, foundPrefixes) {
        const colonIdx = line.indexOf(':');
        if (colonIdx !== -1) {
            const prefix = line.substring(0, colonIdx).trim();
            if (targetPrefixes.includes(prefix)) {
                foundPrefixes.add(prefix);
            }
        }
    }

    downloadBtn.addEventListener('click', () => {
        if (!processedBlobUrl) return;
        const a = document.createElement('a');
        a.href = processedBlobUrl;
        a.download = "compressed.txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    });
</script>

</body>
</html>
